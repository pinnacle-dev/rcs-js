name: Regenerate SDK

on:
  workflow_dispatch:
    inputs:
      docs_commit:
        description: Exact 40-character pinnacle-dev/docs commit
        required: true
      version:
        description: New semantic package version
        required: true

concurrency:
  group: regenerate-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Validate immutable inputs
        env:
          DOCS_COMMIT: ${{ inputs.docs_commit }}
          SDK_VERSION: ${{ inputs.version }}
        run: |
          [[ "$DOCS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
      - name: Check out the reviewed private generator
        env:
          DEPLOY_KEY: ${{ secrets.PINNACLE_DOCS_DEPLOY_KEY }}
          DOCS_COMMIT: ${{ inputs.docs_commit }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/pinnacle-docs-deploy-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git init docs
          git -C docs remote add origin git@github.com:pinnacle-dev/docs.git
          git -C docs fetch --depth=1 origin main:refs/remotes/origin/main
          test "$DOCS_COMMIT" = "$(git -C docs rev-parse origin/main)"
          git -C docs checkout --detach origin/main
      - name: Check out the SDK without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: docs/sdks/typescript
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.7.0
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - name: Authenticate to the matching private generator package
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate without Fern credentials
        run: pnpm --dir docs run sdk:generate -- typescript
        env:
          SDK_VERSION: ${{ inputs.version }}
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
      - name: Apply generated sources
        working-directory: docs
        run: scripts/apply-generated-sdk.sh typescript
      - name: Test generated SDK
        working-directory: docs/sdks/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec vitest --project unit --run
          pnpm exec vitest --project wire --run
      - name: Verify clean consumer install
        working-directory: docs/sdks/typescript
        run: |
          mkdir -p "$RUNNER_TEMP/package" "$RUNNER_TEMP/consumer"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          npm install --prefix "$RUNNER_TEMP/consumer" "$RUNNER_TEMP"/package/*.tgz
          node -e 'const sdk = require(process.argv[1]); if (typeof sdk.PinnacleClient !== "function") process.exit(1)' "$RUNNER_TEMP/consumer/node_modules/rcs-js"
      - name: Create the reviewed patch
        id: patch
        working-directory: docs/sdks/typescript
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/sdk.patch"
          if [[ -s "$RUNNER_TEMP/sdk.patch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/sdk.patch
          if-no-files-found: error
          retention-days: 1

  open-pull-request:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out the SDK without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download generated patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-patch-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Open reviewed update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ inputs.version }}
          DOCS_COMMIT: ${{ inputs.docs_commit }}
        run: |
          git apply --index --binary "$RUNNER_TEMP/sdk.patch"
          branch="sdk-generation/${SDK_VERSION}-${GITHUB_RUN_ID}"
          git config user.name "pinnacle-sdk-bot"
          git config user.email "sdk-bot@pinnacle.sh"
          git switch -c "$branch"
          git commit -m "Regenerate SDK ${SDK_VERSION}"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          cat > "$RUNNER_TEMP/sdk-pr.md" <<EOF
          ## Generated update

          - Version: \`${SDK_VERSION}\`
          - Private generator commit: \`${DOCS_COMMIT}\`
          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Native build, unit, wire, and clean-package consumer tests passed before this pull request was opened.
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base master --title "Regenerate SDK ${SDK_VERSION}" --body-file "$RUNNER_TEMP/sdk-pr.md"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
